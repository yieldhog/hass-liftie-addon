name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-addon:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: "./liftie"

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint YAML files
        uses: frenck/action-yamllint@v1

  build:
    name: Build image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A real end-to-end check: clones Liftie and installs its deps in the
      # Home Assistant base image, exactly as the Supervisor would on-device.
      - name: Build the add-on image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest \
            --tag local/liftie:ci \
            ./liftie
