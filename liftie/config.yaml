# Home Assistant add-on manifest for Liftie.
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration
name: Liftie
version: "4.4.0-2"
slug: liftie
description: Self-hosted Liftie — free, unlimited ski-resort lift status API
url: https://github.com/yieldhog/hass-liftie-addon/tree/main/liftie
# Alpine + s6-overlay base images provide the container init; see build.yaml.
init: false
arch:
  - aarch64
  - amd64
  - armv7
# Expose Liftie's HTTP API on the host so the Ski Resort integration (and any
# browser) can reach it at http://<home-assistant-host>:3000.
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Liftie HTTP API (used as the integration's "Liftie base URL")
# Optional allowlist of resort slugs. Empty = track every resort Liftie bundles
# (it re-scrapes them all every ~30 min). List slugs (e.g. "vail") to limit
# scraping to just those. Slugs match the /api/resort/<slug> path.
options:
  resorts: []
schema:
  resorts:
    - str
